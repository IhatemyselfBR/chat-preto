<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#eee;font-family:Arial,sans-serif;height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;display:flex;flex-direction:column;height:100%}
header{padding:18px;background:#151515;border-bottom:1px solid #252525;font-size:18px}
#messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{padding:11px 14px;border-radius:15px;background:#242424;max-width:82%;overflow-wrap:anywhere}
.me{align-self:flex-end;background:#174b3b}
small{display:block;text-align:right;color:#aaa;margin-top:5px;font-size:10px}
form{display:flex;gap:8px;padding:12px;background:#151515}
input{flex:1;min-width:0;border:0;outline:0;border-radius:24px;background:#292929;color:white;padding:14px;font-size:16px}
button{border:0;border-radius:50%;width:46px;height:46px;background:#eee;color:#111;font-size:20px}
#notice{padding:8px 14px;color:#999;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="app">
<header>Conversa</header>
<div id="notice">Prévia do chat · mensagens locais neste aparelho</div>
<div id="messages"></div>
<form id="form">
<input id="message" placeholder="Mensagem..." autocomplete="off" required>
<button aria-label="Enviar">➤</button>
</form>
</div>
<script>
const box=document.querySelector('#messages');
const input=document.querySelector('#message');
let messages=[];
try{messages=JSON.parse(localStorage.getItem('chat-mensagens')||'[]')}catch{}
function render(){
 box.innerHTML='';
 messages.forEach(m=>{
  const el=document.createElement('div');
  el.className='msg '+(m.me?'me':'');
  const t=document.createElement('div');
  t.textContent=m.text;
  const s=document.createElement('small');
  s.textContent=m.time;
  el.append(t,s);box.append(el);
 });
 box.scrollTop=box.scrollHeight;
}
document.querySelector('#form').addEventListener('submit',e=>{
 e.preventDefault();
 const text=input.value.trim();if(!text)return;
 messages.push({text,me:true,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
 localStorage.setItem('chat-mensagens',JSON.stringify(messages));
 input.value='';render();
});
render();
</script>
</body>
</html>
